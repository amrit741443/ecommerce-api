[workspace]
resolver = "3"
members = [
    "services/auth-service",
    "services/product-service",
    "services/cart-service",
    "services/order-service",
    "services/payment-service",
    "services/notification-service",
    "gateway/api-gateway",

    "crates/config",
    "crates/errors",
    "crates/observability",
    "crates/messaging",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
# Added "serde" and "clock" features to chrono
chrono = { version = "0.4.45", features = ["serde", "clock"] }

sqlx = { version = "0.9.0", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "rust_decimal",
    "uuid",
    "chrono",
    "migrate",
] }
rust_decimal = { version = "1.36", features = ["db-postgres", "serde"] }

dotenvy = "0.15"
serde_json = "1.0.151"
anyhow = "1.0.104"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

reqwest = { version = "0.13.5", default-features = false, features = [
    "json",

] }
