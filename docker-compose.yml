services:

  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/auth.Dockerfile
    ports:
      - "8001:8001"
  
  cart-service:
    build:
      context: .
      dockerfile: infrastructure/docker/cart.Dockerfile
    ports:
      - "8002:8002"
  
  notification-service:
    build:
      context: .
      dockerfile: infrastructure/docker/notification.Dockerfile
    ports:
      - "8003:8003"
  
  order-service:
    build:
      context: .
      dockerfile: infrastructure/docker/order.Dockerfile
    ports:
      - "8004:8004"

  payment-service:
    build:
      context: .
      dockerfile: infrastructure/docker/payment.Dockerfile
    ports:
      - "8005:8005"

  product-service:
    build:
      context: .
      dockerfile: infrastructure/docker/product.Dockerfile
    ports:
      - "8006:8006"

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/gateway.Dockerfile
    ports:
      - "8080:8080"
  
  
  postgres:
    image: postgres:17-alpine
    container_name: ecommerce_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  nats:
    image: nats:2-alpine
    container_name: ecommerce_nats
    restart: unless-stopped
    ports:
      - "4222:4222"

volumes:
  postgres_data:
